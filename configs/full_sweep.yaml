extends: base.yaml
name: full_sweep

optim:
  lr_mode: absolute
  steps: 1000

# Axes other than lr. The lr axis is handled by the runner's ascending early-exit
# scan (see scripts/run_sweep.py) so diverged learning rates are never executed.
sweep:
  model.parameterization: [standard, ntk, mup]
  model.width:  [16, 256, 1024, 4096, 16384]
  data.n:       [128, 1024, 16384, 131072]
  # (d, r) is swept as a PAIR, since r <= d. Expanded by expand_dr() in the runner.
  data.dr:      ["4,4", "16,4", "128,4", "128,32", "512,4", "512,32", "512,512",
                 "2048,4", "2048,32", "2048,512", "4096,4", "4096,32", "4096,512"]

lr_scan:
  values: logspace          # 1.58x spacing; a linear grid puts 98/101 points in the nan regime
  lo: 0.0001
  hi: 1.0
  num: 51
  stop_after_diverged: 2    # stop a cell after this many consecutive diverged lrs

# Skip configurations that cannot finish in reasonable time/memory.
# Checked before any work is done; skipped cells are recorded, not silently dropped.
limits:
  max_params: 100000000     # d*m
  max_act_bytes: 4000000000 # n*m*4 -- activations are unavoidable and dominate
  max_n_times_m: 1000000000
  min_capacity: 1           # n/d < 1: cannot identify an r-dim subspace from n points
  max_capacity: 1000        # n/d > 1000: saturated, nothing changes
