extends: base.yaml
name: dataset-sweep

# base.yaml's baseline except for the swept axes, at the step count this sweep ran with.
optim:  {steps: 1000}

sweep:
  data.n: [64, 2048, 65536]
  target.alpha: [0.0, 1.0]

# lr is the measured axis, relative to eta_crit = 2/lambda_max(H) so the same
# grid lands in the same regime at every width.
lr_scan: {values: linspace, lo: 0.1, hi: 5.0, num: 51}

limits:
  max_params: 100000000
  max_act_bytes: 4000000000
  max_n_times_m: 1000000000
  min_capacity: 0.5
  max_capacity: 1000

slurm:
  gpus: nvidia_h100_80gb_hbm3_2g.20gb:1
  cpus_per_task: 3
  mem: 70G
  time: "6:00:00"
  array: "0-5%6"
